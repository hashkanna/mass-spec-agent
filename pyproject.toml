[project]
name = "msagent"
version = "0.1.0"
description = "Mass-Spec Agent: describe the experiment you want, get a defensible cohort of public proteomics samples and files, with evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "bm25s>=0.2",
    "wordllama>=0.3",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
map = ["umap-learn>=0.5", "scikit-learn>=1.4"]
agent = ["anthropic>=0.40"]
dense = ["fastembed>=0.4"]
dev = ["pytest>=8"]
all = ["msagent[mcp,web,map,agent,dev]"]

[project.scripts]
msagent = "msagent.cli:main"
msagent-mcp = "msagent.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["msagent*"]

[tool.setuptools.package-data]
msagent = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
